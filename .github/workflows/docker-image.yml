name: Review App

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
   - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

   - name: Build Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./app
          push: true
          tags: ghcr.io/dmitriy282/my-app:${{ env.IMAGE_TAG }}

  - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services

        run: | 
         cd ./my-review_apps
         docker compose up -d


  - name: Send Deployment Annotation to Grafana
      if: success()
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          PAYLOAD=$(jq -n \
            --arg time "$(date +%s%3N)" \
            --arg text "Deployment of space-explorer-logbook triggered by $ACTOR. Commit: $SHA" \
            '{
              time: ($time | tonumber),
              isRegion: false,
              # Зверніть увагу на теги. За ними ви будете шукати цю анотацію в Grafana
              tags: ["deploy", "space-explorer-logbook", "production"], 
              text: $text
            }')

          curl -s -X POST -H "Authorization: Bearer $GRAFANA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$GRAFANA_URL/api/annotations"

  # -------------------------------------------------------------------------
  # Build and deploy
  # -------------------------------------------------------------------------
  - name: Deploy to Server via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    script: |
    # Логинимся в GHCR уже внутри вашего сервера
    echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    sudo usermod -aG docker $USER

    newgrp docker
        # Скачиваем обновленный образ
    docker pull ghcr.io/dmitriy282/my-app:${{ env.IMAGE_TAG }}

    cd /reviews_apps

            # Запускаем новый контейнер
    docker compose up -d
        
