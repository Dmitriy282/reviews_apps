name: Review App

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # Build and deploy
  # -------------------------------------------------------------------------
  - name: Deploy to Server via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    script: |
    # Логинимся в GHCR уже внутри вашего сервера
    echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    sudo usermod -aG docker $USER

    newgrp docker
        # Скачиваем обновленный образ
    docker pull ghcr.io/dmitriy282/my-app:${{ env.IMAGE_TAG }}

    cd /reviews_apps 

            # Запускаем новый контейнер
    docker compose up -d
        
