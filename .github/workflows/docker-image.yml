name: Deploy to GCP
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # Если нужно деплоить еще и при пулл-реквестах, раскомментируйте строки ниже:
  # pull_request:
  #   types: [opened, synchronize]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set image tag
        run: |
          TIMESTAMP=$(date +%s)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=${TIMESTAMP}-${SHA}" >> $GITHUB_ENV


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./my-review-app
          push: true
          tags: ${{ env.REGISTRY }}/dmitriy282/my-app:${{ env.IMAGE_TAG }}
      - name: Generate Dynamic Host for Traefik
        id: vars
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_DOMAIN="34-176-31-27.sslip.io"
          
          # Шукаємо кастомний хост у форматі [host: назва]
          CUSTOM_HOST=$(echo "$COMMIT_MSG" | grep -oP '(?<=\[host: )[a-zA-Z0-9_-]+(?=\])' || echo "")
          
          if [ -n "$CUSTOM_HOST" ]; then
            # Якщо є перевизначення: my-feature.34-176-31-27.sslip.io
            HOST_VALUE="${CUSTOM_HOST}.${BASE_DOMAIN}"
          else
            # За замовчуванням: a1b2c3d.34-176-31-27.sslip.io
            HOST_VALUE="${SHORT_SHA}.${BASE_DOMAIN}"
          fi
          
          echo "DYNAMIC_HOST=$HOST_VALUE" >> $GITHUB_ENV
          echo "Згенерований хост: $HOST_VALUE"
          
      - name: Deploy to GCP Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DYNAMIC_HOST: ${{ env.DYNAMIC_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DYNAMIC_HOST
          script: |
            # 1. Логинимся в GitHub Container Registry на сервере GCP
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            # 2. Скачиваем свежий собранный образ
            docker pull ${{ env.REGISTRY }}/dmitriy282/my-app:${{ env.IMAGE_TAG }}
            # 3. Переходим в директорию проекта на сервере
            # ВАЖНО: Укажите здесь реальный путь к папке на ВАШЕМ сервере GCP, где лежит docker-compose.yml
            cd /home/${{ secrets.SERVER_USER }}/reviews_apps/my-review-app
            # 4. Передаем тег в окружение и перезапускаем docker compose
            echo "DYNAMIC_HOST={{ $DYNAMIC_HOST" }} >> .env
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            docker compose down # опционально, если нужно полностью пересоздать
            docker compose up -d
