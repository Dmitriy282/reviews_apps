name: Review App

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # Build and deploy
  # -------------------------------------------------------------------------
  deploy:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    outputs:
      review_url: ${{ steps.review.outputs.review_url }}

    environment:
      name: review/pr-${{ github.event.pull_request.number }}
      url: ${{ steps.review.outputs.review_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate Review App variables
        id: review
        shell: bash
        env:
          PUBLIC_IP: ${{ vars.REVIEW_PUBLIC_IP }}
        run: |
          set -euo pipefail

          REVIEW_ID="review-${GITHUB_REPOSITORY_ID}-pr-${{ github.event.pull_request.number }}"
          REVIEW_HOST="pr-${{ github.event.pull_request.number }}.${PUBLIC_IP//./-}.sslip.io"
          IMAGE_NAME="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}"

          {
            echo "review_id=${REVIEW_ID}"
            echo "review_host=${REVIEW_HOST}"
            echo "review_url=http://${REVIEW_HOST}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "REVIEW_ID=${REVIEW_ID}"
            echo "REVIEW_HOST=${REVIEW_HOST}"
            echo "REVIEW_URL=http://${REVIEW_HOST}"
            echo "IMAGE=${IMAGE}"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=review-app
          cache-to: type=gha,mode=max,scope=review-app

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REVIEW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.REVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare Review App configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .review-deploy

          cp docker-compose.review.yml .review-deploy/docker-compose.yml

          cat > .review-deploy/runtime.env <<EOF
          REVIEW_ID=${REVIEW_ID}
          REVIEW_HOST=${REVIEW_HOST}
          APP_IMAGE=${IMAGE}
          APP_ENV=review
          APP_URL=${REVIEW_URL}
          EOF

      - name: Copy configuration to Review host
        shell: bash
        env:
          SSH_HOST: ${{ secrets.REVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.REVIEW_SSH_USER }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/opt/review-apps/${REVIEW_ID}"

          ssh "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${REMOTE_DIR}' && chmod 700 '${REMOTE_DIR}'"

          scp \
            .review-deploy/docker-compose.yml \
            .review-deploy/runtime.env \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"

      - name: Deploy Review App
        shell: bash
        env:
          SSH_HOST: ${{ secrets.REVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.REVIEW_SSH_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/opt/review-apps/${REVIEW_ID}"

          printf '%s' "$GHCR_TOKEN" |
            ssh "${SSH_USER}@${SSH_HOST}" \
              "docker login ghcr.io \
                --username '${GHCR_USERNAME}' \
                --password-stdin"

          ssh "${SSH_USER}@${SSH_HOST}" "
            set -eu

            cd '${REMOTE_DIR}'

            docker compose \
              --project-name '${REVIEW_ID}' \
              --env-file runtime.env \
              pull

            docker compose \
              --project-name '${REVIEW_ID}' \
              --env-file runtime.env \
              up \
              --detach \
              --remove-orphans
          "

      - name: Wait for Review App
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "${REVIEW_URL}/health"; then
              echo "Review App is ready: ${REVIEW_URL}"
              exit 0
            fi

            echo "Waiting for Review App (${attempt}/30)..."
            sleep 5
          done

          echo "Review App did not become healthy"
          exit 1

      - name: Show logs after failed deployment
        if: failure()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.REVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.REVIEW_SSH_USER }}
        run: |
          REMOTE_DIR="/opt/review-apps/${REVIEW_ID}"

          ssh "${SSH_USER}@${SSH_HOST}" "
            if [ -d '${REMOTE_DIR}' ]; then
              cd '${REMOTE_DIR}'

              docker compose \
                --project-name '${REVIEW_ID}' \
                --env-file runtime.env \
                logs --tail=200
            fi
          " || true

  # -------------------------------------------------------------------------
  # Remove Review App when PR is closed
  # -------------------------------------------------------------------------
  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Calculate Review App variables
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_ID="review-${GITHUB_REPOSITORY_ID}-pr-${{ github.event.pull_request.number }}"

          echo "REVIEW_ID=${REVIEW_ID}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REVIEW_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.REVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Remove Review App
        shell: bash
        env:
          SSH_HOST: ${{ secrets.REVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.REVIEW_SSH_USER }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/opt/review-apps/${REVIEW_ID}"

          ssh "${SSH_USER}@${SSH_HOST}" "
            set -eu

            if [ -f '${REMOTE_DIR}/docker-compose.yml' ]; then
              cd '${REMOTE_DIR}'

              docker compose \
                --project-name '${REVIEW_ID}' \
                --env-file runtime.env \
                down \
                --volumes \
                --remove-orphans \
                --timeout 30
            fi

            rm -rf '${REMOTE_DIR}'
          "
